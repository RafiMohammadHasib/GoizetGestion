\u00e8rement r\\u00e9am\\u00e9nag\\u00e9s. Jardin privatif de 98 m2 enti\\u00e8rement clos avec acc\\u00e8s direct, terrasse pav\\u00e9e, table et bancs.\\n\\nDeux places de stationnement num\\u00e9rot\\u00e9es sont disponibles. Le mobilier et les \\u00e9quipements sont r\\u00e9cents.\\n\\nCuisine ouverte sur le salon, enti\\u00e8rement \\u00e9quip\\u00e9e ( nombreux rangements, four, micro-ondes, r\\u00e9frig\\u00e9rateur-cong\\u00e9lateur, plaque vitroc\\u00e9ramique, hotte aspirante, lave vaisselle, lave linge, aspirateur, centrale \\u00e0 vapeur, machine \\u00e0 caf\\u00e9, bouilloire, vaisselle, couverts\\u2026)\\n\\nSalon disposant d\\u2019un grand meuble de rangement, 2 canap\\u00e9s, table basse, grande table, banc et chaises, meuble pour t\\u00e9l\\u00e9vision ou \\u00e9quipement audio. Salle d\\u2019eau avec grande douche \\u00e0 l\\u2019Italienne. WC au RDC et \\u00e0 l\\u2019\\u00e9tage.\\n\\nChambres avec lit de 140, oreillers, al\\u00e8se et couette, table de chevet, armoire, \\u00e9tag\\u00e8res, penderie, bureau, lampe de bureau et tabouret.\\n\\nLoyer : 1.527 \\u20ac \\\/ mois - ( 509 \\u20ac par colocataire )\\nCharges locatives de la r\\u00e9sidence : 27 \\u20ac \\\/ mois ( hors assurance, \\u00e9lectricit\\u00e9, eau et t\\u00e9l\\u00e9phone-internet ) - ( 9 \\u20ac par colocataire )\\nMontant total : 1.554 \\u20ac \\\/ mois - ( 518 \\u20ac par colocataire )\\n\\nBail commun aux colocataires\\n\\nD\\u00e9p\\u00f4t de garantie : deux mois de loyer\\nHonoraires : 847,56\\u20ac\\n\\nDisponible d\\u00e8s maintenant !\"}}]},\"edge_media_to_comment\":{\"count\":0},\"edge_liked_by\":{\"count\":7},\"commenter_count\":0,\"taken_at_timestamp\":1790603015,\"owner\":{\"id\":\"38105977679\",\"profile_pic_url\":\"https:\\\/\\\/scontent.cdninstagram.com\\\/v\\\/t51.82787-19\\\/660818688_18075984659265680_7407342007465344802_n.jpg?stp=dst-jpg_s100x100_tt6&_nc_cat=109&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0\\u00253D&_nc_ n petit immeuble de caract\\u00e8re en plein hypercentre de Bordeaux, \\u00e0 proximit\\u00e9 imm\\u00e9diate du Mus\\u00e9e d\\u2019Aquitaine et de la rue Sainte-Catherine.\\n\\nL\\u2019appartement vient de b\\u00e9n\\u00e9ficier d\\u2019une r\\u00e9novation compl\\u00e8te et fait l\\u2019objet de sa premi\\u00e8re mise en location depuis les travaux.\\n\\nTr\\u00e8s lumineux et b\\u00e9n\\u00e9ficiant d\\u2019une belle hauteur sous plafond, il offre une agr\\u00e9able sensation d\\u2019espace et a \\u00e9t\\u00e9 enti\\u00e8rement pens\\u00e9 pour proposer un cadre de vie confortable et fonctionnel.\\n\\nCuisine, salle de bain, mobilier et \\u00e9quipements sont neufs.\\n\\nMalgr\\u00e9 sa situation en plein c\\u0153ur de Bordeaux, le logement b\\u00e9n\\u00e9ficie d\\u2019un environnement particuli\\u00e8rement calme.\\n\\nL\\u2019appartement est enti\\u00e8rement meubl\\u00e9 et comprend notamment :\\n\\n* cuisine neuve et enti\\u00e8rement \\u00e9quip\\u00e9e : r\\u00e9frig\\u00e9rateur, plaques de cuisson, micro-ondes, vaisselle, bouilloire et ustensiles\\n* salle de bain enti\\u00e8rement r\\u00e9nov\\u00e9e\\n* lave-linge\\n* t\\u00e9l\\u00e9vision\\n* dressing et rangements\\n* espace de travail avec bureau\\n* mobilier neuf de qualit\\u00e9\\n* chauffage \\u00e9lectrique individuel\\n* ballon d\\u2019eau chaude individuel\\n\\nEmplacement :\\n\\n* rue Sainte-Catherine \\u00e0 2 minutes \\u00e0 pied\\n* Mus\\u00e9e d\\u2019Aquitaine \\u00e0 2 minutes\\n* tram B \\u2013 arr\\u00eat \\u00ab Mus\\u00e9e d\\u2019Aquitaine \\u00bb \\u00e0 3 minutes\\n* trams A, B et F \\u2013 arr\\u00eat \\u00ab H\\u00f4tel de Ville \\u00bb \\u00e0 7 minutes\\n* commerces, restaurants et services accessibles \\u00e0 pied\\n\\n1er \\u00e9tage sans ascenseur.\\n\\nDPE : E.\\n\\nLoyer : 900 \\u20ac charges comprises par mois.\\n\\nZone soumise \\u00e0 encadrement des loyers :\\n\\n* loyer de r\\u00e9f\\u00e9rence major\\u00e9 : 797\\u20ac \\\/ mois\\n* compl\\u00e9ment de loyer : 73 \\u20ac \\\/ mois\\n* provision pour charges : 30 \\u20ac \\\/ mois\\n\\nLocation meubl\\u00e9e\\n\\nDisponible imm\\u00e9diatement !\"}}]},\"edge_media_to_comment\":{\"count\":0},\"edge_liked_by\":{\"count\":15},\"commenter_count\":0,\"taken_at_timestamp\":1790601495,\"owner\":{\"id\":\"38105977679\",\"profile_pic_url\":\"https:\\\/\\\/scontent.cdninstagram.com\\\/v\\\/t51.82787-19\\\/660818688_18075984659265680_7407342007465344802_n.jpg?stp=dst-jpg_s100x100_tt6&_nc_cat=109&ccb=7-5&_nc_sid=bf7eb4&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDgwLkMzIn0\\u00253D&_nc_ohc=dXKC0QVzURsQ7kNvwHGZawz&_nc_oc=AdrziCXjEkp1NuZ0M2VOdXgRvT_GVJtMO51HG5PpwycMb59pjrARGOGN3MMRGFzfaow&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=efcIGJxc6RxEC2MXYCvgww&_nc_ss=7f689&oh=00_AQNDtU8UIpK5IDTA3oE-NQwk2X1hyhdTbKiVk7Se8tP-Nw&oe=6ACAA516\",\"username\":\"goizetgestion\",\"followed_by_viewer\":false,\"has_public_story\":true,\"is_private\":false,\"is_unpublished\":false,\"is_verified\":false,\"edge_followed_by\":{\"count\":132},\"edge_owner_to_timeline_media\":{\"count\":25},\"edge_owner_to_timeline_video_media\":{\"count\":0}},\"like_and_view_counts_disabled\":false,\"is_affiliate\":false,\"is_paid_partnership\":false,\"coauthor_producers\":[],\"media_preview\":null,\"location\":{\"id\":\"333899650622123\",\"name\":\"Bordeaux, France\",\"slug\":\"bordeaux-france\"},\"edge_media_to_sponsor_user\":{\"edges\":[]},\"sharing_friction_info\":{\"should_have_sharing_friction\":false,\"bloks_app_url\":null},\"pinned_for_users\":[],\"media_overlay_info\":null,\"edge_sidecar_to_children\":{\"edges\":[{\"node\":{\"__typename\":\"GraphImage\",\"id\":\"3996177150200057535\",\"shortcode\":\"Dd1RfIJNQ6_\",\"is_video\":false,\"commenter_count\":0,\"dimensions\":{\"height\":799,\"width\":1080},\"display_url\":\"https:\\\/\\\/instagram.fdac146-1.fna.fbcdn.net\\\/v\\\/t51.82787-15\\\/825325409_18103874954265680_3838021350997951068_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=102&_nc_map=urlgen_bucketless&ig_cache
