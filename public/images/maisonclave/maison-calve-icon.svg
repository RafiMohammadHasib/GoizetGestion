<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    :root {
      --bg: #f9f9f6;
      --border: #e3ded6;
      --m-color: #172123;
      --c-color: #5b7074;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #172123;
        --border: #3a4b4e;
        --m-color: #ffffff;
        --c-color: #758d91;
      }
    }
  </style>
  <rect width="60" height="60" x="2" y="2" rx="16" fill="var(--bg)" stroke="var(--border)" stroke-width="2.5"/>
  <text x="32" y="42" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.07em">
    <tspan fill="var(--m-color)">m</tspan><tspan fill="var(--c-color)">c</tspan>
  </text>
</svg>
